# Bagicha staging on Render (docs/deploy.md). Secrets are set in the dashboard, never here.
services:
  - type: web
    name: bagicha-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    autoDeploy: true
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: staging
      - key: AUTH_EXPOSE_OTP
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: LOG_LEVEL
        value: info
      - key: MEDIA_ENDPOINT
        value: s3.ap-south-1.amazonaws.com
      - key: MEDIA_PORT
        value: "443"
      - key: MEDIA_USE_SSL
        value: "true"
      - key: MEDIA_REGION
        value: ap-south-1
      # Free tier allows one Key Value per workspace: Bagicha shares opd-redis, apart on database 1.
      - key: REDIS_URL
        value: redis://red-dbhgb78473hc739u2ho0:6379/1
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MEDIA_BUCKET
        sync: false
      - key: MEDIA_ACCESS_KEY
        sync: false
      - key: MEDIA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
